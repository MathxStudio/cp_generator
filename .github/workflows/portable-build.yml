name: portable-build

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onedir --name CPGenerator --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy scripts/desktop_launcher.py
            smoke_cmd: dist/CPGenerator/CPGenerator --smoke-test
            archive_cmd: tar -czf cp-generator-linux-portable.tar.gz -C dist CPGenerator
            archive_path: cp-generator-linux-portable.tar.gz
          - os: windows-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onefile --name CPGenerator --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy scripts/desktop_launcher.py
            smoke_cmd: powershell -Command "& ./dist/CPGenerator.exe --smoke-test"
            archive_cmd: powershell -Command "Compress-Archive -Path dist/CPGenerator.exe -DestinationPath cp-generator-windows-portable.zip -Force"
            archive_path: cp-generator-windows-portable.zip
          - os: macos-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onedir --name CPGenerator --runtime-hook scripts/pyinstaller_rth_library_path.py --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy --add-binary "$(brew --prefix cairo)/lib/libcairo.2.dylib:." scripts/desktop_launcher.py
            smoke_cmd: ./dist/CPGenerator.app/Contents/MacOS/CPGenerator --smoke-test
            archive_cmd: ditto -c -k --sequesterRsrc dist/CPGenerator.app cp-generator-macos-portable.zip
            archive_path: cp-generator-macos-portable.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libcairo2 libcairo2-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv (Windows, no cache)
        if: runner.os == 'Windows'
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Install uv
        if: runner.os != 'Windows'
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Freeze application
        run: ${{ matrix.freeze_cmd }}

      - name: Smoke-test frozen application
        run: ${{ matrix.smoke_cmd }}

      - name: Wait for Windows launcher to unlock
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline) {
            $processes = Get-Process CPGenerator -ErrorAction SilentlyContinue
            if ($processes) {
              $processes | Stop-Process -Force
              Start-Sleep -Seconds 1
              continue
            }
            try {
              $stream = [System.IO.File]::Open(
                "dist/CPGenerator.exe",
                [System.IO.FileMode]::Open,
                [System.IO.FileAccess]::Read,
                [System.IO.FileShare]::None
              )
              $stream.Close()
              exit 0
            } catch {
              Start-Sleep -Milliseconds 500
            }
          }
          throw "dist/CPGenerator.exe stayed locked after the smoke test."

      - name: Archive Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path cp-generator-windows-portable.zip) {
            Remove-Item cp-generator-windows-portable.zip -Force
          }
          Compress-Archive -Path dist/CPGenerator.exe -DestinationPath cp-generator-windows-portable.zip -Force
          if (-not (Test-Path cp-generator-windows-portable.zip)) {
            throw "cp-generator-windows-portable.zip was not created."
          }

      - name: Archive bundle
        if: runner.os != 'Windows'
        run: ${{ matrix.archive_cmd }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_path }}
          path: ${{ matrix.archive_path }}
          retention-days: 30
