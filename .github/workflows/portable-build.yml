name: portable-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_cmd: tar -czf CPGenerator-linux.tar.gz -C dist CPGenerator
            archive_path: CPGenerator-linux.tar.gz
          - os: windows-latest
            archive_cmd: powershell -Command "Compress-Archive -Path dist/CPGenerator -DestinationPath CPGenerator-windows.zip -Force"
            archive_path: CPGenerator-windows.zip
          - os: macos-latest
            archive_cmd: ditto -c -k --sequesterRsrc --keepParent dist/CPGenerator CPGenerator-macos.zip
            archive_path: CPGenerator-macos.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libcairo2 libcairo2-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Freeze application
        run: >
          uv run pyinstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name CPGenerator
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --collect-all scipy
          main.py

      - name: Archive bundle
        run: ${{ matrix.archive_cmd }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_path }}
          path: ${{ matrix.archive_path }}
          retention-days: 30
