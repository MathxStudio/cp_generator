name: build-artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-validation:
    name: python-validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libcairo2 libcairo2-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Run Python tests
        run: uv run python -m unittest discover -s tests -t . -q

      - name: Run validation corpus
        run: uv run cp-generator-diagnostics --fail-on-mismatch

  android-debug-apk:
    name: android-debug-apk
    needs:
      - python-validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Lint, test, and assemble debug APK
        working-directory: android-app
        env:
          CHAQUOPY_BUILD_PYTHON: python
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp-generator-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  verify-release-version:
    name: verify-release-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Verify tag, Python package, and Android version
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          python_version = pyproject["project"]["version"]

          gradle_text = Path("android-app/app/build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(r'versionName\s*=\s*"([^"]+)"', gradle_text)
          if match is None:
              raise SystemExit("Could not find Android versionName in build.gradle.kts")
          android_version = match.group(1)

          mismatches = []
          if python_version != version:
              mismatches.append(
                  f"pyproject.toml version {python_version!r} does not match tag {version!r}"
              )
          if android_version != version:
              mismatches.append(
                  f"android-app/app/build.gradle.kts versionName {android_version!r} does not match tag {version!r}"
              )
          if mismatches:
              raise SystemExit("\n".join(mismatches))
          print(f"Release tag {version} matches Python and Android version metadata.")
          PY

  portable-build:
    name: portable-${{ matrix.label }}
    needs:
      - python-validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onedir --name CPGenerator --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy src/cp_generator/__main__.py
            archive_cmd: tar -czf cp-generator-linux-portable.tar.gz -C dist CPGenerator
            archive_path: cp-generator-linux-portable.tar.gz
          - label: windows
            os: windows-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onefile --name CPGenerator --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy src/cp_generator/__main__.py
            archive_cmd: powershell -Command "Compress-Archive -Path dist/CPGenerator.exe -DestinationPath cp-generator-windows-portable.zip -Force"
            archive_path: cp-generator-windows-portable.zip
          - label: macos
            os: macos-latest
            freeze_cmd: uv run pyinstaller --noconfirm --clean --windowed --onefile --name CPGenerator --hidden-import tkinter --hidden-import tkinter.ttk --collect-all scipy src/cp_generator/__main__.py
            archive_cmd: ditto -c -k --sequesterRsrc dist/CPGenerator cp-generator-macos-portable.zip
            archive_path: cp-generator-macos-portable.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libcairo2 libcairo2-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Freeze application
        run: ${{ matrix.freeze_cmd }}

      - name: Archive bundle
        run: ${{ matrix.archive_cmd }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_path }}
          path: ${{ matrix.archive_path }}
          retention-days: 30

  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - verify-release-version
      - portable-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cp-generator-linux-portable.tar.gz
          path: release/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cp-generator-windows-portable.zip
          path: release/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cp-generator-macos-portable.zip
          path: release/macos

      - name: Prepare release assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/out
          mv release/linux/cp-generator-linux-portable.tar.gz "release/out/cp-generator-linux-${version}-portable.tar.gz"
          mv release/windows/cp-generator-windows-portable.zip "release/out/cp-generator-windows-${version}-portable.zip"
          mv release/macos/cp-generator-macos-portable.zip "release/out/cp-generator-macos-${version}-portable.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: CP Generator ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/out/*
