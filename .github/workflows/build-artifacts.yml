name: build-artifacts

on:
  workflow_dispatch:
  push:

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-debug-apk:
    name: android-debug-apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Assemble debug APK
        working-directory: android-app
        env:
          CHAQUOPY_BUILD_PYTHON: python
        run: gradle :app:assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: cp-generator-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  portable-build:
    name: portable-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            archive_cmd: tar -czf cp-generator-linux-portable.tar.gz -C dist CPGenerator
            archive_path: cp-generator-linux-portable.tar.gz
          - label: windows
            os: windows-latest
            archive_cmd: powershell -Command "Compress-Archive -Path dist/CPGenerator -DestinationPath cp-generator-windows-portable.zip -Force"
            archive_path: cp-generator-windows-portable.zip
          - label: macos
            os: macos-latest
            archive_cmd: ditto -c -k --sequesterRsrc --keepParent dist/CPGenerator cp-generator-macos-portable.zip
            archive_path: cp-generator-macos-portable.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y python3-tk libcairo2 libcairo2-dev pkg-config

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pkg-config

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Freeze application
        run: >
          uv run pyinstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name CPGenerator
          --hidden-import tkinter
          --hidden-import tkinter.ttk
          --collect-all scipy
          src/cp_generator/__main__.py

      - name: Archive bundle
        run: ${{ matrix.archive_cmd }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_path }}
          path: ${{ matrix.archive_path }}
          retention-days: 30
