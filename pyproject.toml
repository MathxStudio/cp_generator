[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cp-generator"
version = "0.3.1"
description = "Desktop origami crease-pattern generator with diagnostics and 3D fold preview"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cairosvg>=2.7.0",
    "numpy>=1.24.0",
    "reportlab>=4.2.0",
    "scipy>=1.10.0",
    "svgwrite>=1.4.0",
]

[project.scripts]
cp-generator = "cp_generator.app:main"
cp-generator-diagnostics = "cp_generator.diagnostics_cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cp_generator = ["data/corpus/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
